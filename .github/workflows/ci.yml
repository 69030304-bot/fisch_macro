name: CI & Windows Executable Build

on:
  push:
    branches:
      - main
      - develop
      - 'team/**'
      - 'feature/**'
      - 'test/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"
  CI: "true"

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install xvfb & tk (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Compile check
        run: python -m compileall -q .

      - name: Run Pytest suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/ -v

      - name: Run Pytest suite (Windows & macOS)
        if: runner.os != 'Linux'
        run: pytest tests/ -v

      - name: Run standalone service compatibility tests
        run: python test_service.py

  build-windows:
    name: Build Windows Executables (.exe)
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build FischMacro.exe (Desktop App GUI)
        run: |
          pyinstaller --clean --noconfirm --onefile --noconsole --name "FischMacro" fisch_macro.py

      - name: Build FischBackend.exe (Auth & Database Server)
        run: |
          pyinstaller --clean --noconfirm --onefile --console --name "FischBackend" main.py

      - name: Package Windows Release Distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/FischMacro-Windows-x64"
          Copy-Item "dist/FischMacro.exe" -Destination "package/FischMacro-Windows-x64/"
          Copy-Item "dist/FischBackend.exe" -Destination "package/FischMacro-Windows-x64/"
          Copy-Item "settings.example.json" -Destination "package/FischMacro-Windows-x64/"
          Copy-Item "setup.bat" -Destination "package/FischMacro-Windows-x64/"
          Copy-Item "start_app.bat" -Destination "package/FischMacro-Windows-x64/"
          Copy-Item "start_backend.bat" -Destination "package/FischMacro-Windows-x64/"
          Copy-Item "view_database.bat" -Destination "package/FischMacro-Windows-x64/"
          Copy-Item "README.md" -Destination "package/FischMacro-Windows-x64/"
          Copy-Item "USER_GUIDE.md" -Destination "package/FischMacro-Windows-x64/"
          Compress-Archive -Path "package/FischMacro-Windows-x64/*" -DestinationPath "dist/FischMacro-Windows-x64.zip" -Force

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FischMacro-Windows-x64
          path: |
            dist/FischMacro.exe
            dist/FischBackend.exe
            dist/FischMacro-Windows-x64.zip
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FischMacro-Windows-x64.zip
            dist/FischMacro.exe
            dist/FischBackend.exe
          draft: false
          prerelease: false
          generate_release_notes: true
