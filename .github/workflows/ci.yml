name: CI Test Suite

on:
  push:
    branches:
      - develop
      - 'team/**'
      - 'feature/**'
      - 'test/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install xvfb (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk

      - name: Compile check
        run: python -m compileall -q .

      - name: Run Pytest suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/ -v

      - name: Run Pytest suite (Windows & macOS)
        if: runner.os != 'Linux'
        run: pytest tests/ -v

      - name: Run standalone service compatibility tests
        run: python test_service.py
